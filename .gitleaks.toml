# StackChan 公开树 gitleaks 配置
# 只放行测试夹具/文档占位符；不要在这里放行真实 key/token。
[extend]
useDefault = true

[[allowlists]]
description = "unit-test fixtures and documented placeholders"
paths = [
  '''selfhost/tests/''',
  '''selfhost/setup/tests/''',
]
regexes = [
  '''sk-test-[0-9a-fA-F]+''',
  '''sk-xxxxxxxxxxxxxxxx''',
  '''dev-device-token''',
  '''test-token''',
  '''REPLACE_WITH_64_HEX''',
]
